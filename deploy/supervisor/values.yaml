app: supervisor

image:
  repository: localhost/supervisor
  tag: dev

global:
  hostPath: /kubestorage/globals/supervisor
  mountPath: /global

ports:
  backoffice: 9090
  public: 18090

# Domains and CIDRs are injected at package time by deploy/supervisor/package.sh
# from the required BACKOFFICE_DOMAIN, PUBLIC_DOMAIN, and ALLOWED_CIDR env vars.
domains:
  backoffice: __BACKOFFICE_DOMAIN__
  public: __PUBLIC_DOMAIN__

access:
  allowedCIDRs:
    - __ALLOWED_CIDR__

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi
