apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app }}-backoffice
  namespace: {{ .Values.app }}
  labels:
    app: {{ .Values.app }}
spec:
  selector:
    app: {{ .Values.app }}
  ports:
    - name: http
      port: 80
      targetPort: backoffice
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app }}-public
  namespace: {{ .Values.app }}
  labels:
    app: {{ .Values.app }}
spec:
  selector:
    app: {{ .Values.app }}
  ports:
    - name: http
      port: 80
      targetPort: public
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.app }}-ip-allowlist
  namespace: {{ .Values.app }}
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.access.allowedCIDRs }}
      - {{ . | quote }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app }}-backoffice
  namespace: {{ .Values.app }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.app }}-{{ .Values.app }}-ip-allowlist@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.domains.backoffice }}
      secretName: {{ .Values.app }}-backoffice-tls
  rules:
    - host: {{ .Values.domains.backoffice }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.app }}-backoffice
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app }}-public
  namespace: {{ .Values.app }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.app }}-{{ .Values.app }}-ip-allowlist@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.domains.public }}
      secretName: {{ .Values.app }}-public-tls
  rules:
    - host: {{ .Values.domains.public }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.app }}-public
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app }}
  namespace: {{ .Values.app }}
  labels:
    app: {{ .Values.app }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.app }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: prepare-global-storage
          image: busybox:1.36
          command:
            - sh
            - -c
            - "mkdir -p {{ .Values.global.mountPath }} && chown -R 65532:65532 {{ .Values.global.mountPath }} && chmod -R g+rwX {{ .Values.global.mountPath }}"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: global-storage
              mountPath: {{ .Values.global.mountPath }}
      containers:
        - name: {{ .Values.app }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - {{ .Values.global.mountPath }}/supervisor/config.yml
            - -v
          ports:
            - name: backoffice
              containerPort: {{ .Values.ports.backoffice }}
            - name: public
              containerPort: {{ .Values.ports.public }}
          readinessProbe:
            httpGet:
              path: /backoffice/healthz
              port: backoffice
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /backoffice/healthz
              port: backoffice
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: global-storage
              mountPath: {{ .Values.global.mountPath }}
      volumes:
        - name: global-storage
          hostPath:
            path: {{ .Values.global.hostPath }}
            type: DirectoryOrCreate
