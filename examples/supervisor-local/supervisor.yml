state_dir: ./build

stability_time: 30s
crash_window: 10s
crash_threshold: 3
exec_fail_threshold: 2
kill_grace_period: 2s
version_folder_retention: 0
reject_expiry: 2m

supervisor:
  bind_address: 127.0.0.1:9190
  favicon:
    name: LO
  metric_labels:
    source: example-supervisor-local

vars:
  GREETING: "Hello from local supervisor snapshot"

# Memory tracking is on by default. On a Kubernetes pod the limit comes from the
# Downward API env var or the cgroup; this dev box has neither, so limit_bytes
# provides an explicit pod limit (256Mi) just for the example, letting the
# supervisor derive per-component soft/hard budgets. A real pod leaves
# limit_bytes unset and relies on the env var / cgroup.
memory:
  enabled: true
  limit_bytes: 268435456   # 256Mi — dev-only explicit pod limit
  sample_interval: 2s

remote:
  base_url: file://./fixture
  target: required.txt
  polling_interval: 5s
  signature_public_key_path: ""

components:
  - name: hello
    description: "Local snapshot hello app"
    port: 18091
    command: "./hello.bin --port=18091"
    memory:
      share: 0.40              # 40% of the workload budget (lower this to see warn/fail)
    urls:
      healthz: /healthz
      readyz: /readyz
      state: /state
      metrics: /metrics
    proxy_urls:
      greet: /greet
      health-on-port: :18091/healthz

external_components:
  - name: external-hello
    description: "Hello app started outside supervisor"
    url: http://127.0.0.1:18092
    urls:
      healthz: /healthz
      readyz: /readyz
      state: /state
      metrics: /metrics
    proxy_urls:
      greet: /greet
