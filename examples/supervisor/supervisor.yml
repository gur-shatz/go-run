state_dir: ./state

stability_time: 300s
crash_window: 30s
crash_threshold: 3
exec_fail_threshold: 2
kill_grace_period: 2s
version_folder_retention: 2
# Short for the demo: a rejected version is re-attempted after 2 minutes.
# Production: hours or days, matched to your vendor's typical patch cadence.
reject_expiry: 2m

supervisor:
  bind_address: 127.0.0.1:9090
  favicon:
    name: EX
  # Login gate on the whole supervisor surface (every route, including
  # /backoffice/healthz). Unauthenticated visitors land on a /login form; a
  # correct login sets a session cookie. The hint is shown under the form so
  # anyone poking at the demo can see the throwaway credentials. Never set
  # hint in production — these creds are not secret.
  basic_auth:
    enabled: true
    username: admin
    password: changeme
    hint: "demo login: admin / changeme"
  # Const labels stamped on every metric this supervisor emits and on the
  # label_path of every state document. A fleet aggregator (or Prometheus
  # join) uses them to disambiguate multiple supervisors.
  metric_labels:
    source: example-supervisor

# Component monitoring, in two independently toggleable parts.
#   scrape:  poll each component's healthz/state/metrics into the registry
#            (on by default; set enabled: false to turn off — the supervisor's
#            own liveness and per-component process state still work).
#   observe: persist that state and serve a console at /health (current state,
#            transition events, per-target rollups). In-memory; resets on restart.
statemonitor:
  scrape:
    enabled: true
  observe:
    enabled: true

# Template context for every component's *.tmpl files. Overrides keys from
# the version manifest's default_vars. The hello example ships manifest.yml
# with GREETING="Hello (vendor default)"; the line below overrides it so the
# child's GREETING environment variable — and the /greet endpoint — reflect
# the customer value instead.
vars:
  GREETING: "Hi from the customer's supervisor.yml"

# file:// remote — points at the ./fixture directory next to this file.
# `make example-supervisor` builds the hello component and writes
# fixture/hello/{versions/required.txt,images/v1_<os>_<arch>.tar.gz}
# before launching the supervisor. No origin process, no signature key.
#
# To switch to the HTTP origin variant:
#   1. Run `make example-supervisor-origin` in another terminal.
#   2. Change base_url to http://127.0.0.1:18080
#   3. Set signature_public_key_path: ./origin/keys/update.pub
remote:
  base_url: file://./fixture
  target: required.txt
  polling_interval: 5s
  signature_public_key_path: "" # empty: skip Ed25519 verify (dev / trusted local FS only)

# Every component declares its port — that's the well-known HTTP endpoint the
# child binds. The supervisor surfaces it (plus the URL paths below) in /state
# so the control plane can compose http://127.0.0.1:<port><path>.
#
# `command` is plain argv (shlex-split). The supervisor sets the child's
# working directory to the version dir, so `./bin/hello` resolves to the
# binary inside the tarball. Launch facts flow as OP_* env vars and
# artifact-compatible aliases (BUILD_DIR/BUILDDIR point at the version dir;
# REQUIRED_VERSION/VERSION name the selected version). hello reads
# OP_MONITOR_PORT if --port isn't passed.
components:
  - name: hello
    description: "A simple HTTP server"
    port: 18090
    command: "./bin/hello --port=18090"
    # Markdown shown on the component's portal page (/components/hello/).
    # Relative to this file. Read at request time, so edits show up live.
    readme: ./readme/hello.md
    env:
      LOG_LEVEL: info
    # urls block is optional — these are the defaults the supervisor expects.
    urls:
      healthz: /healthz
      readyz: /readyz
      state: /state
      metrics: /metrics
