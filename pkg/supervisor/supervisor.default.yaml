state_dir: /var/lib/go-run

stability_time: 5m
crash_window: 1m
crash_threshold: 3
exec_fail_threshold: 2
kill_grace_period: 5s
version_folder_retention: 2

# reject_expiry: how long an autonomously-recorded rejection stays active.
# After this duration the supervisor will re-attempt the version if the
# remote still asks for it; a genuinely-bad version earns a fresh
# rejection. Omit (or set to 0) to disable autonomous clearing — rejections
# then stay active forever within this host.
# reject_expiry: 24h

# Per-version stdout/stderr log capture (state_dir/logs/<component>/<version>/).
# log_max_size:  bytes per active file before rotating to <base>.1
# log_max_files: history generations to keep (negative = no history)
log_max_size: 10485760
log_max_files: 5

supervisor:
  bind_address: 127.0.0.1:9090
  favicon:
    name: GR
  # basic_auth: optional login gate on the supervisor's HTTP server. When
  # enabled, every route redirects unauthenticated visitors to a plain /login
  # form — including the /backoffice/healthz probe, so point any
  # liveness/readiness probe at the component port or expect a redirect. A
  # correct login sets a signed session cookie valid for 12h. username and
  # password are required.
  # basic_auth:
  #   enabled: true
  #   username: admin
  #   password: changeme   # template with env to avoid hard-coding a secret
  #   hint: "demo login: admin / changeme"  # shown under the form; demos only

# memory: per-component memory tracking and (on Linux + cgroup v2) enforcement.
# Tracking is ON BY DEFAULT: with no block at all the supervisor measures each
# component's usage. Set `enabled: false` to turn it off entirely.
#
# Budgets are never absolute bytes. The pod limit is read automatically — from
# MEMORY_LIMIT_BYTES if set (Kubernetes Downward API, resourceFieldRef:
# limits.memory), otherwise from the container cgroup. On a dev box with no pod
# limit, the supervisor just measures (no soft/hard budgets). When a limit is
# known, each component's relative share is partitioned into soft/hard budgets,
# so resizing the pod rescales every component automatically. Per-component
# shares go under each component's own memory:.
#
# Enforcement has two independent axes:
#   A) Kernel enforcement (cgroup v2 only): the supervisor builds a leaf per
#      component under workload/, charges each child into its leaf, and writes
#      memory.high/memory.max/memory.oom.group so the KERNEL throttles and
#      OOM-kills the leaf. Auto-on on a writable cgroup v2 node.
#   B) Supervisor "choose" actions (any mode): an enforcer watches each
#      component's memory STATE (warn = over soft threshold, fail = over hard
#      threshold) and, once a component is fail for `sustained_for`, terminates
#      it. A memory kill is treated exactly like the process crashing on its own
#      — fast-crash accounting, backoff, and bad-version rollback all apply. This
#      is platform-independent (exact leaf figure under cgroup v2, else RSS), so
#      it runs (and is testable) on the macOS dev box. Gated by `memory.enforce`
#      (default on); a component sets `monitor_only: true` to opt out of killing.
# In cgroup v2 both run: the supervisor pre-empts and the kernel is the backstop.
# In host/cgroup1 only axis B runs (best-effort, no backstop).
# memory:
#   enabled: true                       # master switch; on by default
#   enforce: true                       # global switch for supervisor memory kills; on by default
#   limit_env_var: MEMORY_LIMIT_BYTES   # override the pod-limit env var name
#   limit_bytes: 0                      # dev-only explicit pod limit (fallback after the env var)
#   supervisor_reserve: 0.08            # fraction of the limit held for the supervisor
#   cache_headroom: 0.10               # extra slack below the hard pool for page cache/slab
#   sample_interval: 5s                # cheap-sample cadence
#   pss_interval: 60s                  # slower PSS (smaps_rollup) cadence; 0 disables
#   raw_window: 1h                     # in-memory history for the live view + sparkline
#   retention: 72h                     # how long on-disk NDJSON sample files are kept
#   sustained_for: 60s                 # time in the fail state before a kill (global)
#   pod_pressure_high: 0.90            # container-current / limit ratio that trips pod pressure
#   pod_pressure_psi: 0.10             # pod PSI 'some' ratio that trips pod pressure
# ...and per component, under its own memory: (budget + the one enforcement knob)
#   memory:
#     share: 0.40                      # fraction of the workload budget, OR:
#     hardlimit: 40m                   # absolute hard cap in bytes (k/m/g/t units);
#                                      #   alternative to share, needs no pod limit
#     softlimit: 32m                   # optional absolute warn band paired with hardlimit
#                                      #   (default: derived ~10% below the hard cap)
#     monitor_only: false              # true = track + warn/fail state but never kill
#     tracking: true                   # per-component sampling on/off

updates:
  enabled: true

remote:
  base_url: https://updates.example.com
  target: required.txt
  polling_interval: 1m
  secret: ""
  signature_public_key_path: /etc/go-run/update.pub

# Each component below is required to have:
#   - name:    unique identifier
#   - port:    well-known TCP port the child binds for its HTTP surface
#   - command: plain argv (shlex-split). The supervisor sets the child's
#              working directory to the version dir, so "./bin/x" resolves
#              to the binary inside the tarball. Launch facts flow as OP_*
#              env vars and artifact-compatible aliases: VERSION, BUILD_DIR,
#              BUILDDIR, MONITOR_PORT, REQUIRED_VERSION, etc.
# Optionally:
#   - urls:    {healthz,readyz,state,metrics} path overrides (default: /healthz etc.)
#   - env:     extra environment variables passed to the child
#   - remote:  per-component override of the top-level remote block
components: []
